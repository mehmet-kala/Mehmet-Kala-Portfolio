name: Deploy site to GitHub Pages

# The website lives in the site/ subfolder. GitHub Pages' simple "deploy from
# branch" mode can only publish the repo root or /docs, so this workflow uploads
# site/ as the Pages artifact instead — no files have to be moved or renamed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # lets the wait step below list this run's artifacts
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      # deploy-pages looks the artifact up straight after the upload, and GitHub's
      # artifact list can lag behind it, failing with "No artifacts named
      # github-pages" (actions/deploy-pages#451). Wait until the list shows it.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 45); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "$n" -ge 1 ]; then echo "listed after ~$((i * 2))s"; sleep 5; exit 0; fi
            sleep 2
          done
          echo "still not listed after 90s; trying the deploy anyway"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
